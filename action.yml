name: 'QuetZ Autonomous Software Engineer'
description: 'Production-grade, fail-closed autonomous engineering agent that reproduces, resolves, and verifies GitHub issues with signed certificates.'
author: 'Aniketkoppaka'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  issue-id:
    description: 'Unique issue identifier (e.g. GH-101)'
    required: false
    default: '${{ github.event.issue.number }}'
  issue-title:
    description: 'Issue title'
    required: false
    default: '${{ github.event.issue.title }}'
  issue-body:
    description: 'Issue description'
    required: false
    default: '${{ github.event.issue.body }}'
  github-token:
    description: 'GitHub Token for opening pull requests and branch creation'
    required: true
  require-reproduction:
    description: 'Fail-closed if bug cannot be reproduced pre-patch'
    required: false
    default: 'true'
  mutation-testing:
    description: 'Run AST mutation test matrix to verify assertion strength'
    required: false
    default: 'true'

outputs:
  certificate-id:
    description: 'Cryptographic Verification Certificate ID'
    value: '${{ steps.run-quetz.outputs.certificate_id }}'
  status:
    description: 'Execution status (COMPLETED or ABSTAINED)'
    value: '${{ steps.run-quetz.outputs.status }}'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install QuetZ
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run QuetZ Resolution Cycle
      id: run-quetz
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        python -m autonomous_engineer run \
          --repo "${{ github.repository }}" \
          --issue-id "${{ inputs.issue-id }}" \
          --title "${{ inputs.issue-title }}" \
          --body "${{ inputs.issue-body }}" \
          --require-reproduction \
          --mutation-testing \
          --open-pr \
          --out-dir artifacts/