[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-software-engineer"
version = "0.1.0"
description = "An autonomous software engineering agent that resolves GitHub issues end-to-end."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "autonomous-software-engineer contributors" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
autonomous-engineer = "autonomous_engineer.cli:main"
quetz = "autonomous_engineer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.setuptools.package-data]
autonomous_engineer = ["web/static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Do not recurse into src/ -- avoids false-positive collection of domain
# classes named Test* (TestCaseResult, TestOutcome, TestSuiteResult).
norecursedirs = ["src", "*.egg-info", ".git", ".venv", "venv", "dist", "build"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "unit: Unit tests with no external dependencies",
    "integration: Integration tests that may require external services",
    "slow: Tests that take more than a few seconds",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["autonomous_engineer"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "scripts/", "examples/"]