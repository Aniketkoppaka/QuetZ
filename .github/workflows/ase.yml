name: Autonomous Software Engineer (ASE)

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_id:
        description: "Issue number or ID (e.g. owner/repo#42)"
        required: true
      title:
        description: "Issue title"
        required: true
      body:
        description: "Issue description / error traceback"
        required: true
      reproduce_cmd:
        description: "Test command to reproduce failure (e.g. pytest -k test_zero_division)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autonomous-resolve:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'autonomous-fix'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Determine Issue Context
        id: context
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "issue_id=${{ github.event.inputs.issue_id }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.title }}" >> $GITHUB_OUTPUT
            echo "body=${{ github.event.inputs.body }}" >> $GITHUB_OUTPUT
            echo "reproduce_cmd=${{ github.event.inputs.reproduce_cmd }}" >> $GITHUB_OUTPUT
          else
            echo "issue_id=${{ github.repository }}#${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
            echo "body=${{ github.event.issue.body }}" >> $GITHUB_OUTPUT
            echo "reproduce_cmd=" >> $GITHUB_OUTPUT
          fi

      - name: Run Autonomous Engineering Pipeline
        id: ase_run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'nvidia/nemotron-3-super-120b-a12b:free' }}
        run: |
          mkdir -p artifacts
          REPRO_ARG=""
          if [ -n "${{ steps.context.outputs.reproduce_cmd }}" ]; then
            REPRO_ARG="--reproduce-cmd \"${{ steps.context.outputs.reproduce_cmd }}\" --require-reproduction"
          fi

          python -m autonomous_engineer run \
            --repo . \
            --issue-id "${{ steps.context.outputs.issue_id }}" \
            --title "${{ steps.context.outputs.title }}" \
            --body "${{ steps.context.outputs.body }}" \
            --mutation-testing \
            --open-pr \
            --out-dir artifacts \
            $REPRO_ARG

      - name: Dispatch Pull Request via GitHub API
        if: success() && hashFiles('artifacts/pr_payload.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'EOF'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload_path = Path("artifacts/pr_payload.json")
          if not payload_path.exists():
              print("No PR payload found. Skipping dispatch.")
              exit(0)

          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          branch = payload["branch_name"]
          base = payload["base_branch"]
          title = payload["title"]
          body = payload["body"]
          commit_msg = payload["commit_message"]

          print(f"Creating git branch: {branch}")
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "checkout", "-b", branch], check=True)
          subprocess.run(["git", "add", "-A"], check=True)
          subprocess.run(["git", "commit", "-m", commit_msg], check=True)
          subprocess.run(["git", "push", "origin", branch, "--force"], check=True)

          # Open Pull Request using GitHub CLI (gh)
          subprocess.run([
              "gh", "pr", "create",
              "--title", title,
              "--body", body,
              "--head", branch,
              "--base", base
          ], check=True)
          EOF

      - name: Upload Verification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ase-verification-artifacts
          path: artifacts/
